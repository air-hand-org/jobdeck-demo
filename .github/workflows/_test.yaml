name: Test

on:
  workflow_call:

permissions: {}

# Keep only the newest test run for a branch or pull request.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@942a96db0ec375d908dd8a8fd97cefc6eaf9f734 # v1.7.2
      - uses: air-hand-org/jobdeck-actions/actions/cache-go@942a96db0ec375d908dd8a8fd97cefc6eaf9f734 # v1.7.2
      - name: build
        run: make build
      - name: lint
        run: make lint
      - name: check clean
        run: make check-clean
      - name: test
        run: make test
